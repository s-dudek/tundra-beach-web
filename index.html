<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="description" content="Tundra Beach – unter Wasser: die Bildmarke in 3D und vier Blasen mit Wasserstand, Wetter, Kalender und Kontakt.">
<link rel="icon" type="image/svg+xml" href="web_bildmarke_tundra-beach.svg">
<title>Tundra Beach</title>
<link rel="stylesheet" href="marke.css">
</head>
<body>

  <!-- Im Untermenü: Pfeil nach oben, zurück zur Startseite -->
  <button class="zurueck" id="zurueck" type="button" hidden><span aria-hidden="true">←</span> Zurück zur Startseite</button>

  <main class="tour" id="tour">
    <div class="buehne">
      <h1 class="titel" id="titel"><span>Willkommen bei</span><strong>Tundra Beach</strong></h1>

      <!-- Ohne WebGL bleibt die flache Bildmarke stehen. Mit WebGL schwebt sie als 3D-Körper im Wasser. -->
      <img class="flach" src="web_marke-gelb_tundra-beach.svg" alt="Bildmarke von Tundra Beach: ein Schild mit einem Kopf, riesiger Nase, Taucherbrille und Schnorchel">
      <canvas class="marke3d" id="marke3d" role="img" aria-label="Tundra Beach unter Wasser: die Bildmarke in 3D. Ziehen dreht sie, Scrollen schaut nach unten: dort schweben die Blasen zu Wasserstand, Wetter, Kalender und Kontakt."></canvas>

      <div class="blasen" id="blasen"></div>
      <p class="spielstand" id="spielstand" aria-hidden="true">Geplatzt: 0</p>
      <button class="runter" id="runter" type="button" tabindex="-1" aria-label="Nach unten scrollen zu den Bereichen">Scroll down <span aria-hidden="true">&darr;</span></button>
      <!-- Menü für die ruhige Variante (reduzierte Bewegung): ohne Flug direkt zu den Bereichen -->
      <nav class="menue" id="menue" aria-label="Bereiche">
        <button type="button" data-ziel="wasserstand">Wasserstand</button>
        <button type="button" data-ziel="wetter">Wetter</button>
        <button type="button" data-ziel="kalender">Kalender</button>
        <button type="button" data-ziel="kontakt">Kontakt</button>
      </nav>
      <button class="nachoben" id="nachoben" type="button" tabindex="-1" aria-label="Nach oben zum Anfang"><span aria-hidden="true">&uarr;</span> To the top</button>
    </div>
  </main>

  <!-- Inhalte als Text: für Screenreader und wenn 3D nicht läuft -->
  <section class="daten" id="daten" aria-label="Inhalte">
    <article id="d-wasserstand"><h2>Wasserstand</h2><div class="zeilen"></div></article>
    <article id="d-wetter"><h2>Wetter in Lienz</h2><div class="zeilen"></div></article>
    <article id="d-kalender"><h2>Kalender und Uhr</h2><div class="zeilen"></div></article>
    <article id="d-kontakt"><h2>Kontakt</h2><div class="zeilen"></div></article>
  </section>

  <nav class="legal-footer" aria-label="Rechtliches">
    <a href="mailto:info@tundra-beach.at">Kontakt</a>
    <span aria-hidden="true">&middot;</span>
    <a href="impressum.html">Impressum</a>
    <span aria-hidden="true">&middot;</span>
    <a href="datenschutz.html">Datenschutz</a>
  </nav>

  <script src="geometrie.js"></script>
  <script src="schrift3d.js"></script>
  <script src="daten.js"></script>
  <script src="symbole.js"></script>
  <script src="marke3d.js" defer></script>
</body>
</html>
