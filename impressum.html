<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="web_bildmarke_tundra-beach.svg">
<title>Impressum — Tundra Beach</title>
<style>
  :root{
    --bg: #ffffff;
    --ink: #2c2c2b;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0;
    padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body{
    min-height: 100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: clamp(32px, 8vh, 72px) 24px 64px;
    gap: 40px;
  }
  .bg-photo{
    position: fixed;
    inset: 0;
    z-index: 0;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    overflow:hidden;
    pointer-events:none;
  }
  .bg-photo img{
    height: min(24vh, 210px);
    width:auto;
    max-width: 60vw;
    opacity: 0.14;
    transform: translateY(4%);
  }
  .brand-mark{
    position: fixed;
    top: clamp(14px, 3vh, 26px);
    left: clamp(14px, 3vw, 26px);
    z-index: 20;
    display:block;
    width: clamp(38px, 5.6vw, 56px);
    opacity: 0.94;
    transition: opacity .2s ease, transform .2s ease;
  }
  .brand-mark:hover, .brand-mark:focus-visible{
    opacity: 1;
    transform: scale(1.06);
  }
  .brand-mark img{ width:100%; height:auto; display:block; }
  .home-link{ display:block; position:relative; z-index:1; }
  .logo{
    width: min(42vw, 190px);
    height:auto;
    display:block;
  }
  main{
    position: relative;
    z-index: 1;
    width:100%;
    max-width: 560px;
  }
  h1{
    font-size: clamp(20px, 3vw, 26px);
    letter-spacing: 0.02em;
    margin: 0 0 28px;
  }
  h2{
    font-size: clamp(12px, 1.5vw, 14px);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 600;
    opacity: 0.55;
    margin: 28px 0 8px;
  }
  p{
    font-size: clamp(14px, 1.8vw, 16px);
    line-height: 1.65;
    margin: 0;
  }
  a{ color: var(--ink); }
  .back{
    position: relative;
    z-index: 1;
    margin-top: 8px;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    opacity: 0.55;
    border-bottom: 1px solid transparent;
    transition: opacity .2s ease, border-color .2s ease;
  }
  .back:hover, .back:focus-visible{
    opacity: 1;
    border-color: currentColor;
  }
</style>
</head>
<body>

  <div class="bg-photo" aria-hidden="true">
    <img src="web_huette_tundra-beach.svg" alt="">
  </div>

  <a class="brand-mark" href="index.html" aria-label="Zur Startseite">
    <img src="web_bildmarke_tundra-beach.svg" alt="Tundra Beach">
  </a>

  <a class="home-link" href="index.html" aria-label="Zur Startseite">
    <img class="logo" src="web_wortmarke_tundra-beach.svg" alt="Tundra Beach">
  </a>

  <main>
    <h1>Impressum</h1>
    <p>Angaben gem&auml;&szlig; &sect; 5 E-Commerce-Gesetz (ECG)</p>

    <h2>Betreiber</h2>
    <p>Tundra Beach<br>(nicht eingetragener Verein)</p>

    <h2>Vertreten durch</h2>
    <p>Simon Dudek<br>Falkensteinerweg 10<br>9900 Lienz<br>&Ouml;sterreich</p>

    <h2>Kontakt</h2>
    <p><a href="mailto:info@tundra-beach.at">info@tundra-beach.at</a></p>
  </main>

  <a class="back" href="index.html">&larr; Zur&uuml;ck</a>

</body>
</html>
