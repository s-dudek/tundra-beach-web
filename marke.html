<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="description" content="Tundra Beach – das Gesamtlogo mit der Bildmarke in 3D.">
<link rel="icon" type="image/svg+xml" href="web_bildmarke_tundra-beach.svg">
<title>Tundra Beach</title>
<link rel="stylesheet" href="marke.css">
</head>
<body>

  <main class="buehne">
    <h1 class="nur-leser">Tundra Beach</h1>

    <!-- Ohne WebGL bleibt das flache Gesamtlogo (.voll) stehen. Mit WebGL zeigt .schrift nur die Buchstaben
         und das Canvas darüber die Bildmarke als 3D-Körper. -->
    <div class="logo" id="logo">
      <img class="voll" src="gesamt-4c_web.svg" alt="Tundra Beach, Gesamtlogo mit Bildmarke">
      <img class="schrift" src="web_gesamt-schrift_tundra-beach.svg" alt="Tundra Beach">
      <canvas class="marke3d" id="marke3d" aria-hidden="true"></canvas>
    </div>
  </main>

  <nav class="legal-footer" aria-label="Rechtliches">
    <a href="mailto:info@tundra-beach.at">Kontakt</a>
    <span aria-hidden="true">&middot;</span>
    <a href="impressum.html">Impressum</a>
    <span aria-hidden="true">&middot;</span>
    <a href="datenschutz.html">Datenschutz</a>
  </nav>

  <script src="geometrie.js"></script>
  <script src="marke3d.js" defer></script>
</body>
</html>
